<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carolina Blue Palette</title>
<style>
  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 48px;
    background: #f5f5f5;
    color: #222;
  }
  h1 { font-weight: 600; font-size: 20px; margin-bottom: 24px; }
  .palette { display: flex; gap: 20px; flex-wrap: wrap; }
  .swatch {
    width: 200px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    background: #fff;
  }
  .chip { height: 140px; }
  .label { padding: 12px 14px; }
  .name { font-weight: 600; font-size: 14px; }
  .hex { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #555; margin-top: 4px; }
  .note { font-size: 12px; color: #888; margin-top: 6px; }
</style>
</head>
<body>
  <h1>UNC &mdash; Carolina Blue palette</h1>
  <div class="palette">
    <div class="swatch">
      <div class="chip" style="background:#7BAFD4;"></div>
      <div class="label">
        <div class="name">Carolina Blue</div>
        <div class="hex">#7BAFD4</div>
        <div class="note">Pantone 542 &mdash; traditional</div>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#4B9CD3;"></div>
      <div class="label">
        <div class="name">Carolina Blue</div>
        <div class="hex">#4B9CD3</div>
        <div class="note">Brighter web version</div>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#13294B;"></div>
      <div class="label">
        <div class="name">Navy</div>
        <div class="hex">#13294B</div>
        <div class="note">Dark companion color</div>
      </div>
    </div>
  </div>
</body>
</html>
